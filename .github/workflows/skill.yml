name: skill

# WHY THIS EXISTS (O-66, 2026-08-05).
#
# `skills/immut-proof/SKILL.md` shipped to `main` with YAML frontmatter that never parsed. The
# `description:` value was an unquoted scalar containing `not backup: there is no restore`, and a
# colon-space inside an unquoted scalar is read as a nested mapping key. The consequence is silent:
# the skill loads with EMPTY metadata, so its name and description are dropped. Claude Code invokes a
# skill by its description, and every directory renders that same frontmatter as listing copy, so a
# skill nobody could auto-trigger and nobody could read looked completely fine in review.
#
# Nothing failed loudly. A release, a public-repo storefront pass and a distribution plan all went
# past it. It was found by running `claude plugin validate` while packaging the plugin.
#
# The rule this encodes: A FORMATTING RULE APPLIED TO A MACHINE-READ FILE NEEDS A PARSER IN THE LOOP.
# The em-dash cleanup for root CLAUDE.md hard rule 3 replaced `documents — proving` with
# `documents: proving`, adding a second break to the same line. Same shape as the recorded lesson that
# an em-dash cleanup silently defused its own test fixture.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  frontmatter:
    name: SKILL.md frontmatter parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Every SKILL.md has frontmatter that parses, with a usable name and description
        run: |
          python3 - <<'PY'
          import glob, re, sys
          import yaml

          failed = False
          files = sorted(glob.glob('skills/**/SKILL.md', recursive=True))
          if not files:
              sys.exit("No SKILL.md found. If skills moved, update this workflow.")

          for path in files:
              text = open(path, encoding='utf-8').read()
              m = re.match(r'^---\n(.*?)\n---\n', text, re.S)
              if not m:
                  print(f"::error file={path}::No YAML frontmatter block")
                  failed = True
                  continue
              try:
                  data = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  # This is the O-66 failure. At runtime the skill loads with EMPTY metadata.
                  print(f"::error file={path}::Frontmatter does not parse, so ALL fields are "
                        f"silently dropped at runtime: {str(e).splitlines()[0]}")
                  print("  Fix: make the value a folded block scalar (description: >-) so a colon, "
                        "a quote or an apostrophe needs no escaping.")
                  failed = True
                  continue

              for field in ('name', 'description'):
                  if not (data or {}).get(field):
                      print(f"::error file={path}::Frontmatter is missing '{field}'")
                      failed = True

              # The description is how the host decides to invoke the skill, and how every
              # directory renders the listing. An empty-ish one is not a real failure mode we can
              # test, but a suspiciously short one is worth blocking.
              desc = (data or {}).get('description') or ''
              if desc and len(desc) < 40:
                  print(f"::error file={path}::description is {len(desc)} chars, too short to "
                        f"route on")
                  failed = True

              if not failed:
                  print(f"✅ {path}: name={data['name']!r}, description={len(desc)} chars")

          sys.exit(1 if failed else 0)
          PY

      - name: Install tokenizer
        run: pip install tiktoken

      - name: SKILL.md fits the re-attach budget
        run: |
          python3 - <<'PY'
          import io, sys, tiktoken

          # ⛔ WHY. Claude Code re-attaches only the FIRST ~5,000 tokens of a SKILL.md after compaction.
          # Anything past that is silently absent exactly when the agent has lost its context and most
          # needs the rules. The tail of this file is behaviour-critical: the abstained-file rule, and
          # the pending_approval rule ("never protected, never a valid predecessor"). A missing rule
          # does not error, it just changes what the agent does — the documented servesObjective
          # coin-flip.
          #
          # Measured, not estimated. The chars/4 heuristic previously used read 5,051 and put the file
          # over the cap; the real count is ~4,907. A guess in either direction is useless here.
          CAP = 5000
          WARN = 4700

          path = 'skills/immut-proof/SKILL.md'
          text = io.open(path, encoding='utf-8').read()
          n = len(tiktoken.get_encoding('cl100k_base').encode(text))

          print(f"{path}: {n} tokens (cap {CAP})")
          if n > CAP:
              print(f"::error file={path}::{n} tokens exceeds the {CAP} re-attach budget by {n-CAP}. "
                    f"Everything past the boundary is silently dropped after compaction. "
                    f"Move a section to references/ rather than trimming rules.")
              sys.exit(1)
          if n > WARN:
              print(f"::warning file={path}::{n} tokens, only {CAP-n} below the {CAP} cap. "
                    f"Move a section to references/ before adding anything.")
          PY

      - name: Every referenced file exists
        run: |
          python3 - <<'PY'
          import io, re, os, sys

          # A SKILL.md that points at references/foo.md which does not exist loses those mechanics
          # silently: the agent reads a pointer, finds nothing, and carries on with less than it
          # should. Renaming a reference is the easy way to cause this.
          failed = False
          for skill in ('skills/immut-proof/SKILL.md',):
              base = os.path.dirname(skill)
              text = io.open(skill, encoding='utf-8').read()
              refs = sorted(set(re.findall(r'references/([A-Za-z0-9._-]+\.md)', text)))
              if not refs:
                  print(f"::warning file={skill}::no references/ links found - has the layout changed?")
              for r in refs:
                  target = os.path.join(base, 'references', r)
                  if os.path.exists(target):
                      print(f"  ok  {r}")
                  else:
                      print(f"::error file={skill}::references/{r} is linked but does not exist")
                      failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Dry-run and rehearsal stay removed
        run: |
          # Removed from every surface 2026-07-31 on DJ's instruction and must never reappear under any
          # name. `--dry-run` as a shell script safety flag is deliberately not matched.
          if grep -rniE '\b(dry.run|rehearsal|preview mode)\b' skills/ SETUP.md README.md 2>/dev/null \
             | grep -viE '\-\-dry-run' ; then
            echo "::error::dry-run / rehearsal language reappeared in a customer-facing skill file."
            exit 1
          fi
          echo "OK: no dry-run or rehearsal language."

      - name: Plugin manifest and MCP config parse
        run: |
          python3 -c "
          import json
          for f in ('.claude-plugin/plugin.json', '.mcp.json'):
              json.load(open(f))
              print(f'  ok  {f} parses')
          "
